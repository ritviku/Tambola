<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Poppins,"Noto Sans Devanagari",system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,var(--bg1),var(--bg2) 70%) fixed;overflow-x:hidden}
.sp{position:fixed;inset:0;pointer-events:none;background:radial-gradient(2px 2px at 10% 20%,var(--gold),transparent),radial-gradient(2px 2px at 80% 15%,var(--gold),transparent),radial-gradient(1.5px 1.5px at 60% 70%,var(--gold),transparent),radial-gradient(2px 2px at 25% 80%,var(--gold),transparent),radial-gradient(1.5px 1.5px at 90% 60%,var(--gold),transparent);opacity:.7;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
header{text-align:center;padding:20px 12px 4px;position:relative;z-index:1}
h1{font-family:"Yatra One",Georgia,serif;font-weight:400;font-size:clamp(1.8rem,5vw,3rem);margin:0;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:4px 0 0;color:var(--mut)}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 8px;display:grid;grid-template-columns:1.1fr 1fr;gap:18px;position:relative;z-index:1}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;backdrop-filter:blur(8px)}
.stage{text-align:center}
.cat{display:inline-block;padding:4px 14px;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--ballink);font-weight:800;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.hint{font-size:clamp(1.15rem,3vw,1.65rem);font-weight:600;line-height:1.4;min-height:4.8em;display:flex;align-items:center;justify-content:center;padding:10px 6px}
.ball{width:clamp(170px,40vw,250px);aspect-ratio:1;margin:4px auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,#fff6c9,var(--gold) 40%,var(--gold2));box-shadow:0 0 0 8px rgba(255,200,87,.15),0 0 50px rgba(255,143,31,.5);color:var(--ballink);font-weight:800;font-size:clamp(4rem,14vw,7.5rem);transition:filter .3s}
.ball.wait{filter:saturate(.35) brightness(.85)}
.ball.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.ctl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px;align-items:center}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 22px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--ballink);cursor:pointer;box-shadow:0 4px 14px rgba(255,143,31,.35)}
button.big{font-size:1.2rem;padding:16px 38px;min-width:220px}
button.alt{background:var(--tile);color:var(--ink);border:1px solid var(--line);box-shadow:none}
button:active{transform:scale(.97)}
.hintkey{color:var(--mut);font-size:.8rem;margin-top:10px}
.recent{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;min-height:44px}
.recent span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--gold);color:var(--gold)}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.bh small{color:var(--mut);font-weight:400}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.board div{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;background:var(--tile);border:1px solid var(--line);font-size:clamp(.65rem,2.2vw,.95rem);font-weight:600;color:var(--mut);transition:.3s}
.board div.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ballink);border-color:transparent;box-shadow:0 0 12px rgba(255,143,31,.6);transform:scale(1.05)}
.board div.now{outline:3px solid var(--ink)}
.prizes{max-width:1100px;margin:0 auto 40px;padding:0 16px;position:relative;z-index:1}
.prizes .panel{padding:18px 20px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.prize{display:flex;align-items:center;gap:10px;background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.prize input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold2);flex:none}
.prize .nm{font-weight:600;flex:1}
.prize input[type=text]{width:100px;font:inherit;font-size:.85rem;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.prize.done{background:linear-gradient(90deg,rgba(255,200,87,.25),rgba(255,143,31,.2))}
.prize.done .nm{text-decoration:line-through;opacity:.7}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow input{flex:1;min-width:160px;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--ink)}
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(10,2,20,.65);backdrop-filter:blur(4px);padding:20px}
.modal.show{display:grid}
.mbox{background:var(--bg1);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s ease}
.mbox h3{margin:0 0 8px;font-size:1.3rem}
.mbox p{margin:0 0 20px;color:var(--mut)}
.mbox .ctl{margin-top:0}
button.danger{background:linear-gradient(90deg,#e03131,#c92a2a);color:#fff;box-shadow:0 4px 14px rgba(224,49,49,.4)}
.petal{position:fixed;top:-60px;pointer-events:none;z-index:0;animation:fall linear forwards;will-change:transform}
@keyframes fall{0%{transform:translate3d(0,-60px,0) rotate(0)}50%{transform:translate3d(var(--sw),55vh,0) rotate(180deg)}100%{transform:translate3d(calc(var(--sw)*-.6),115vh,0) rotate(400deg)}}
@media (prefers-reduced-motion:reduce){.petal{display:none}}
</style></head><body><div class="sp"></div>
<header><h1>🪔 Diwali Tambola 🪔</h1><p>Read the clue, let them guess, then reveal the number!</p></header>
<div class="wrap">
<section class="panel stage">

  <div class="hintkey">Tip: press Space or Enter to click</div>
  <div class="ctl"><button class="alt" id="reset">Reset game</button></div>
  <div class="recent" id="recent"></div>
</section>
<section class="panel">
  <div class="bh"><span>Called numbers</span><small id="count">0 / 90</small></div>
  <div class="board" id="board"></div>
</section>
</div>
<div class="prizes"><div class="panel">
  <div class="bh"><span>🏆 Winnings checklist</span><small id="pcount"></small></div>
  <div class="plist" id="plist"></div>
  <div class="addrow"><input type="text" id="newp" placeholder="Add your own prize, e.g. Lucky Seven"><button class="alt" id="addp">Add</button></div>
</div></div>
<div class="modal" id="modal"><div class="mbox"><h3>Reset the game?</h3><p>This clears every called number and the winnings checklist. You can’t undo it.</p><div class="ctl"><button class="alt" id="mno">Keep playing</button><button class="danger" id="myes">Yes, reset</button></div></div></div>

const $=id=>document.getElementById(id);
let cur=0,stage=0;const pool=[],called=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){cur=0;stage=0;pool.length=0;called.length=0;for(let i=1;i<=90;i++)pool.push(i);shuffle(pool);
 $("cat").textContent="Ready?";$("hint").textContent="Click the button to get the first clue";$("ball").textContent="?";$("ball").className="ball wait";
 $("recent").innerHTML="";$("count").textContent="0 / 90";$("go").textContent="Show clue";$("go").disabled=false;
 document.querySelectorAll(".board div").forEach(d=>d.className="")}
function go(){
 if(stage===0){
  if(!pool.length){$("cat").textContent="Housie!";$("hint").textContent="All 90 numbers called. Game over!";$("go").disabled=true;return}
  cur=pool.pop();const [c,t]=H[cur];
  document.querySelectorAll(".board .now").forEach(d=>d.classList.remove("now"));
  $("cat").textContent=c;$("hint").textContent=t;$("ball").textContent="?";$("ball").className="ball wait";
  $("go").textContent="Reveal number";stage=1;
 }else{
  called.push(cur);$("ball").textContent=cur;$("ball").className="ball pop";burst();
  $("count").textContent=called.length+" / 90";
  $("board").children[cur-1].className="on now";
  $("recent").innerHTML=called.slice(-7,-1).reverse().map(x=>"<span>"+x+"</span>").join("");
  $("go").textContent=pool.length?"Next clue":"Finish game";stage=0;
 }
}
$("go").onclick=go;
const closeM=()=>$("modal").classList.remove("show");
$("reset").onclick=()=>$("modal").classList.add("show");
$("mno").onclick=closeM;
$("myes").onclick=()=>{reset();resetPrizes();closeM()};
$("modal").onclick=e=>{if(e.target.id==="modal")closeM()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
document.addEventListener("keydown",e=>{const t=e.target.tagName;if((e.code==="Space"||e.code==="Enter")&&t!=="INPUT"&&t!=="BUTTON"&&!$("modal").classList.contains("show")){e.preventDefault();go()}});
for(let i=1;i<=90;i++){const d=document.createElement("div");d.textContent=i;$("board").appendChild(d)}
/* prizes */
const PR=["Early Five","Four Corners","Top Row","Middle Row","Bottom Row","Full House","Second Full House"];
function addPrize(n){const d=document.createElement("div");d.className="prize";
 d.innerHTML='<input type="checkbox"><span class="nm"></span><input type="text" placeholder="Winner">';
 d.querySelector(".nm").textContent=n;
 d.querySelector("input[type=checkbox]").onchange=e=>{d.classList.toggle("done",e.target.checked);pc()};
 $("plist").appendChild(d);pc()}
function pc(){const a=document.querySelectorAll(".prize");$("pcount").textContent=document.querySelectorAll(".prize.done").length+" / "+a.length+" claimed"}
function resetPrizes(){document.querySelectorAll(".prize").forEach(p=>{p.classList.remove("done");p.querySelector("input[type=checkbox]").checked=false;p.querySelector("input[type=text]").value=""});pc()}
PR.forEach(addPrize);
$("addp").onclick=()=>{const v=$("newp").value.trim();if(v){addPrize(v);$("newp").value=""}};
$("newp").addEventListener("keydown",e=>{if(e.key==="Enter")$("addp").click()});

const PET=["🌼","🌸","🏵️","🌺","🪷","✨","🪔"];
function petal(fast){const p=document.createElement("div");p.className="petal";p.textContent=PET[Math.floor(Math.random()*PET.length)];
 p.style.left=Math.random()*100+"vw";p.style.fontSize=(14+Math.random()*20)+"px";p.style.setProperty("--sw",(Math.random()*160-80)+"px");
 const d=fast?3+Math.random()*2:8+Math.random()*8;p.style.animationDuration=d+"s";document.body.appendChild(p);setTimeout(()=>p.remove(),d*1000+200)}
function burst(){for(let i=0;i<18;i++)setTimeout(()=>petal(true),i*60)}
setInterval(()=>petal(false),700);for(let i=0;i<8;i++)setTimeout(()=>petal(false),i*300);
